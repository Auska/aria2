name: build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:

jobs:
  build-static:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64]
        # arm64 可直接加入 matrix：runner 自带 binfmt/qemu，无需额外 setup
    steps:
    - uses: actions/checkout@v7
    - name: Build static aria2c in Alpine
      run: |
        docker run --rm \
          -v "$PWD:/src:ro" \
          -v "$PWD/output:/output" \
          -e ARCH=${{ matrix.arch }} \
          -e SUFFIX="-${GITHUB_SHA::7}" \
          alpine:3.22 /src/docker/build.sh
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: aria2-linux-${{ matrix.arch }}-${{ github.sha }}
        path: output/aria2-linux-*
        if-no-files-found: error
